plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.junior.tradutortela'
    compileSdk 35

    defaultConfig {
        applicationId 'com.junior.tradutortela'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // OCR latino empacotado no APK: funciona imediatamente.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Identificação do idioma no aparelho.
    implementation 'com.google.mlkit:language-id:17.0.6'

    // Tradução inglês -> português no aparelho; o modelo é baixado no primeiro uso.
    implementation 'com.google.mlkit:translate:17.0.3'
}
